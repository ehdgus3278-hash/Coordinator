<body>
<header>
  <div class="wrap">
    <h1>재활치료 스케줄링 코디네이터</h1>
    <div class="sub">단독 실행판 · 인터넷 / 서버 불필요 · 데이터는 이 브라우저에만 저장됩니다</div>
  </div>

<nav>

<main id="app"></main>

<script>
//==================================================================
// 1. 마스터 데이터 (백엔드 constants.py 와 동일)
//==================================================================
const TIME_SLOTS = [
  "08:00","08:30","09:00","09:30","10:00","10:30","11:00","11:30",
  "13:30","14:00","14:30","15:00","15:30","16:00","16:30",
];

// AM/PM 코드(예: MM301AM/MM301PM)가 배정 가능한 슬롯 범위.
const AM_SLOTS = TIME_SLOTS.filter(t => t < "12:00");
const PM_SLOTS = TIME_SLOTS.filter(t => t >= "12:00");

const BRAIN_ROOM = "뇌재활치료실";
const OT_ROOM = "작업치료실";
const ST_ROOM = "언어치료실";
const BRAIN_THERAPISTS = ["황병훈", "문승현", "이진용", "김동현"];

// 치료실별 명명된 스테이션 목록 (구조 데이터, 사용자 편집 대상 아님 — 백엔드 ROOM_STATIONS 와 동일)
const ROOM_STATIONS = {
  [BRAIN_ROOM]: [
    ...["M1","M2","M3","M4"].map(n => ({ name: n, zone: "M" })),
    ...["B1","B2"].map(n => ({ name: n, zone: "B" })),
    ...["T1","T2","T3"].map(n => ({ name: n, zone: "T" })),
    ...BRAIN_THERAPISTS.map(n => ({ name: n, zone: "THERAPIST" })),
  ],
};

// 처방코드별 표시 라벨 접미사 (예: 홍길동1(301AM), 홍길동M(102), 홍길동T(10204))
const LABEL_SUFFIX = { "MM301AM": "1", "MM301PM": "1", "MM302AM": "2", "MM302PM": "2", "MM102": "M", "MM10204": "T" };

// 분배를 위한 "한 타임당 최대 인원" 제한 (백엔드 constants.py 와 동일).
// 물리적 스테이션 수보다 적게 설정하면 일부 스테이션은 항상 비워두고 다음 시간대로 자동 분산된다.
// THERAPIST구역("1:1치료실" = 치료사별 전담 시간)은 4인이 있지만 한 타임 최대 2명까지만 배정.
const ZONE_CAPACITY = {
  [BRAIN_ROOM]: { M: 3, B: 1, T: 2, THERAPIST: 2 },
};
// zone 구분이 없는(번호 베드) 치료실의 한 타임당 최대 인원 제한.
const ROOM_CAPACITY_OVERRIDE = {
  [OT_ROOM]: 2,
  [ST_ROOM]: 2,
};

// MM301/MM302/MM151/MM105는 오전(AM)/오후(PM) 코드로 완전히 대체되었다.
const DEFAULT_PRESCRIPTIONS = {
  "MM105AM": { name: "중추신경계치료(오전)",      duration: 30, room: BRAIN_ROOM, zones: ["THERAPIST"], timeWindow: "AM" },
  "MM105PM": { name: "중추신경계치료(오후)",      duration: 30, room: BRAIN_ROOM, zones: ["THERAPIST"], timeWindow: "PM" },
  "MM301AM": { name: "보행훈련(오전)",            duration: 30, room: BRAIN_ROOM, zones: ["M","B","T"], timeWindow: "AM" },
  "MM301PM": { name: "보행훈련(오후)",            duration: 30, room: BRAIN_ROOM, zones: ["M","B","T"], timeWindow: "PM" },
  "MM302AM": { name: "보행훈련2(임시명)(오전)",    duration: 30, room: BRAIN_ROOM, zones: ["M","B","T"], timeWindow: "AM" },
  "MM302PM": { name: "보행훈련2(임시명)(오후)",    duration: 30, room: BRAIN_ROOM, zones: ["M","B","T"], timeWindow: "PM" },
  "MM102":   { name: "신경계운동치료(임시명)",     duration: 30, room: BRAIN_ROOM, zones: ["M","B","T"] },
  "MM151AM": { name: "중첩치료(임시명)(오전)",     duration: 30, room: BRAIN_ROOM, zones: ["M","B","T"], overlayTargets: ["MM301AM","MM302AM"], timeWindow: "AM" },
  "MM151PM": { name: "중첩치료(임시명)(오후)",     duration: 30, room: BRAIN_ROOM, zones: ["M","B","T"], overlayTargets: ["MM301PM","MM302PM"], timeWindow: "PM" },
  "MM10204": { name: "보조치료(임시명)",          duration: 30, room: BRAIN_ROOM, zones: ["T"] },
  "MX112": { name: "작업치료",     duration: 15, room: OT_ROOM },
  "MX115": { name: "인지작업치료", duration: 30, room: OT_ROOM },
  "MS201": { name: "언어치료",     duration: 30, room: ST_ROOM },
};

const DEFAULT_ROOMS = {
  [BRAIN_ROOM]: { beds: ROOM_STATIONS[BRAIN_ROOM].length },
  [OT_ROOM]:    { beds: 4 },
  [ST_ROOM]:    { beds: 2 },
};

//==================================================================
// 2. 영속 상태 (localStorage)
//==================================================================
const STORE_KEY = "rehab_coordinator_v2"; // v1(베드 모델) 과 데이터 구조가 달라 키를 분리

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return {
    prescriptions: structuredClone(DEFAULT_PRESCRIPTIONS),
    rooms: structuredClone(DEFAULT_ROOMS),
    patients: [],   // {id, name}
    schedules: [],  // {id, patientId, patientName, code, name, overlayCode, overlayName, room, slot, station, label, date}
    seq: 1,
  };
}

let state = loadState();
function save() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
function nextId() { return state.seq++; }

//==================================================================
// 3. 스케줄링 엔진 (백엔드 scheduler/engine.py 를 그대로 JS 로 포팅)
//==================================================================
function firstSlotGe(t) {
  for (let i = 0; i < TIME_SLOTS.length; i++) if (TIME_SLOTS[i] >= t) return i;
  return TIME_SLOTS.length;
}
function lastSlotLt(t) {
  let r = -1;
  for (let i = 0; i < TIME_SLOTS.length; i++) if (TIME_SLOTS[i] < t) r = i;
  return r;
}
function slotsNeeded(min) { return Math.max(1, Math.ceil(min / 30)); }
function slotIndex(t) { return TIME_SLOTS.indexOf(t); }

function slotEndTime(slot) {
  const [h, m] = slot.split(":").map(Number);
  const tot = h * 60 + m + 30;
  return String(Math.floor(tot / 60)).padStart(2, "0") + ":" + String(tot % 60).padStart(2, "0");
}

// 예: 홍길동1(301), 홍길동2(302), 홍길동1F(301+151), 홍길동M(102), 홍길동T(10204)
function makeLabel(patientName, code, overlayCode) {
  const suffix = LABEL_SUFFIX[code];
  if (suffix === undefined) return patientName;
  const codeNum = code.startsWith("MM") ? code.slice(2) : code;
  if (overlayCode) {
    const overlayNum = overlayCode.startsWith("MM") ? overlayCode.slice(2) : overlayCode;
    return `${patientName}${suffix}F(${codeNum}+${overlayNum})`;
  }
  return `${patientName}${suffix}(${codeNum})`;
}

// 해당 치료실의 스테이션 목록. 명명된 스테이션이 없으면 번호 베드를 합성한다.
function roomStationList(room) {
  const stations = ROOM_STATIONS[room];
  if (stations && stations.length) return stations;
  const beds = state.rooms[room]?.beds ?? 1;
  return Array.from({ length: beds }, (_, i) => ({ name: String(i + 1), zone: null }));
}

function eligibleStationNames(zones, stations) {
  if (!zones || zones.length === 0) return stations.map(s => s.name);
  return stations.filter(s => zones.includes(s.zone)).map(s => s.name);
}

// 분배용 "한 타임당 최대 인원" 제한을 반환. 제한이 없으면 null(물리적 스테이션 수만 적용).
function poolCap(room, zone) {
  if (zone && ZONE_CAPACITY[room] && zone in ZONE_CAPACITY[room]) return ZONE_CAPACITY[room][zone];
  if (!zone && room in ROOM_CAPACITY_OVERRIDE) return ROOM_CAPACITY_OVERRIDE[room];
  return null;
}

// AM/PM 코드가 배정 가능한 슬롯 집합을 반환. 시간대 제한이 없으면 null.
function windowSlots(timeWindow) {
  if (timeWindow === "AM") return new Set(AM_SLOTS);
  if (timeWindow === "PM") return new Set(PM_SLOTS);
  return null;
}

// 주어진 점유 집합 중 같은 zone(분배 풀)에 속하는 개수. zone이 없으면 전체 점유 수.
function zoneCount(occ, zone, stationZone) {
  return zone ? [...occ].filter(s => stationZone[s] === zone).length : occ.size;
}

// 중첩 사용 코드(예: MM151AM)를 대상 코드(예: MM301AM/MM302AM)와 짝지어 하나의 스케줄링 단위로 묶는다.
function buildUnits(orders, rxMap, warnings) {
  const n = orders.length;
  const consumed = new Array(n).fill(false);
  const overlayFor = new Array(n).fill(null);

  for (let i = 0; i < n; i++) {
    const code = orders[i];
    const rx = rxMap[code];
    if (!rx || !rx.overlayTargets) continue;
    const targets = rx.overlayTargets;
    let paired = false;
    for (let j = 0; j < n; j++) {
      if (j === i || consumed[j] || overlayFor[j] !== null) continue;
      if (targets.includes(orders[j])) {
        overlayFor[j] = code;
        consumed[i] = true;
        paired = true;
        break;
      }
    }
    if (!paired) {
      warnings.push(`${code}: 중첩 대상(${targets.join("/")})이 없어 배정하지 못했습니다.`);
      consumed[i] = true;
    }
  }

  const units = [];
  for (let i = 0; i < n; i++) {
    if (consumed[i]) continue;
    const rx = rxMap[orders[i]];
    if (!rx) continue;
    units.push({ code: orders[i], overlay: overlayFor[i], rx });
  }
  return units;
}

// 우선순위 1: 동일 치료실 묶기 (첫 등장 순서 유지)
function groupUnitsByRoom(units) {
  const firstSeen = {}, groups = {};
  for (const u of units) {
    const room = u.rx.room;
    if (!(room in groups)) { firstSeen[room] = Object.keys(firstSeen).length; groups[room] = []; }
    groups[room].push(u);
  }
  return Object.keys(groups).sort((a, b) => firstSeen[a] - firstSeen[b]).map(r => [r, groups[r]]);
}

function schedulePatient(patientName, availStart, availEnd, orders, rxMap, existing, date) {
  const results = [], warnings = [];

  // room -> slot -> Set(점유 중인 스테이션 이름)
  const slotStations = {};
  for (const room of Object.keys(state.rooms)) {
    slotStations[room] = {};
    for (const s of TIME_SLOTS) slotStations[room][s] = new Set();
  }
  for (const s of existing) {
    if (s.date !== date || !s.station) continue;
    if (slotStations[s.room] && slotStations[s.room][s.slot]) slotStations[s.room][s.slot].add(s.station);
  }

  const startIdx = firstSlotGe(availStart);
  const endIdx = lastSlotLt(availEnd);
  if (startIdx > endIdx || endIdx < 0) {
    warnings.push("배정 가능한 시간 슬롯이 없습니다.");
    return { results, warnings };
  }

  for (const o of orders) if (!rxMap[o]) warnings.push("알 수 없는 처방코드: " + o);

  const units = buildUnits(orders, rxMap, warnings);
  const roomGroups = groupUnitsByRoom(units);
  let currentIdx = startIdx;

  for (const [room, roomUnits] of roomGroups) {
    const allStations = roomStationList(room);
    const stationZone = {};
    for (const s of allStations) stationZone[s.name] = s.zone;

    for (const unit of roomUnits) {
      const { code, overlay: overlayCode, rx } = unit;
      const n = slotsNeeded(rx.duration);
      const eligible = eligibleStationNames(rx.zones, allStations);
      const window = windowSlots(rx.timeWindow);

      if (eligible.length === 0) {
        warnings.push(`${code}(${rx.name}): 배정 가능한 스테이션이 없습니다.`);
        continue;
      }

      // 우선순위 4: 전체 가능 시간대를 훑어, 분배 한도를 지키면서 가장 한산한
      // (점유 인원이 가장 적은) 슬롯을 고른다 (로드밸런싱). currentIdx는 하한선으로만 사용.
      let best = null; // { load, i, station }
      for (let i = currentIdx; i < TIME_SLOTS.length; i++) {
        if (i + n - 1 > endIdx) break;
        if (window && Array.from({ length: n }, (_, j) => TIME_SLOTS[i + j]).some(s => !window.has(s))) continue;

        // 필요한 모든 슬롯에서 해당 zone 의 빈 스테이션 + 분배 한도를 확인
        const slotOccupied = [];
        for (let j = 0; j < n; j++) {
          const slot = TIME_SLOTS[i + j];
          const occ = new Set(slotStations[room]?.[slot] ?? []);

          // 이번 배정 실행 중 이미 점유된 스테이션도 고려
          for (const res of results) {
            if (res.room !== room || !res.station) continue;
            const ri = slotIndex(res.slot);
            const rn = slotsNeeded(rxMap[res.code]?.duration ?? 30);
            if (ri <= i + j && i + j < ri + rn) occ.add(res.station);
          }
          slotOccupied.push(occ);
        }

        const feasible = (name) => {
          const zone = stationZone[name];
          const cap = poolCap(room, zone);
          for (const occ of slotOccupied) {
            if (occ.has(name)) return false;
            if (cap !== null && zoneCount(occ, zone, stationZone) >= cap) return false;
          }
          return true;
        };

        const station = eligible.find(feasible);
        if (!station) continue;

        const zone = stationZone[station];
        const load = Math.max(...slotOccupied.map(occ => zoneCount(occ, zone, stationZone)));
        if (best === null || load < best.load) best = { load, i, station };
      }

      if (best === null) {
        warnings.push(`${code}(${rx.name}): 가용 슬롯이 없어 배정하지 못했습니다.`);
        continue;
      }

      const { i, station } = best;
      const overlayName = overlayCode ? (rxMap[overlayCode]?.name ?? null) : null;
      results.push({
        code, name: rx.name, overlayCode, overlayName,
        room, slot: TIME_SLOTS[i], station,
        label: makeLabel(patientName, code, overlayCode),
      });
      for (let j = 0; j < n; j++) slotStations[room][TIME_SLOTS[i + j]].add(station);
      currentIdx = i + n;
    }
  }
  return { results, warnings };
}

//==================================================================
// 4. UI
//==================================================================
const TABS = [
  ["register", "환자 등록"],
  ["patient",  "환자별 시간표"],
  ["room",     "치료실별 시간표"],
  ["rx",       "처방코드 관리"],
];
let activeTab = "register";
let lastResult = null;       // 마지막 배정 결과
let registerForm = { name: "", date: today(), start: "08:00", end: "17:00", codes: [{ room: "", code: "" }] };
let patientView = { patientId: "", date: today() };
let roomView = { room: BRAIN_ROOM, date: today() };

function today() { return new Date().toISOString().split("T")[0]; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
function roomClass(room) {
  if (room.includes("뇌재활")) return "room-brain";
  if (room.includes("작업")) return "room-ot";
  if (room.includes("언어")) return "room-st";
  return "room-etc";
}

function renderNav() {
  document.getElementById("nav").innerHTML = TABS.map(([id, label]) =>
    `<button class="${id === activeTab ? "active" : ""}" onclick="go('${id}')">${label}</button>`
  ).join("");
}

window.go = function (tab) { activeTab = tab; render(); };

function render() {
  renderNav();
  const app = document.getElementById("app");
  if (activeTab === "register") app.innerHTML = viewRegister();
  else if (activeTab === "patient") app.innerHTML = viewPatient();
  else if (activeTab === "room") app.innerHTML = viewRoom();
  else if (activeTab === "rx") app.innerHTML = viewRx();
}

//------------------------------------------------ 환자 등록
function viewRegister() {
  const f = registerForm;
  const roomOptions = Object.keys(state.rooms);
  const codeRows = f.codes.map((c, i) => {
    const codeOptions = Object.entries(state.prescriptions).filter(([, r]) => r.room === c.room);
    return `
    <div class="codeRow">
      <select onchange="onCodeRoom(${i}, this.value)">
        <option value="" ${c.room === "" ? "selected" : ""}>치료실 선택</option>
        ${roomOptions.map(r => `<option value="${esc(r)}" ${r === c.room ? "selected" : ""}>${esc(r)}</option>`).join("")}
      </select>
      <select onchange="onCodeCode(${i}, this.value)" ${c.room ? "" : "disabled"} class="mono">
        <option value="">${c.room ? "처방코드 선택" : "먼저 치료실을 선택하세요"}</option>
        ${codeOptions.map(([code, r]) => `<option value="${code}" ${code === c.code ? "selected" : ""}>${code} - ${esc(r.name)}</option>`).join("")}
      </select>
      ${f.codes.length > 1 ? `<button class="x" onclick="rmCode(${i})">&times;</button>` : ""}
    </div>`;
  }).join("");

  let resultHtml = "";
  if (lastResult) {
    const r = lastResult;
    const warns = r.warnings.length
      ? `<div class="warn">${r.warnings.map(w => `<p>⚠ ${esc(w)}</p>`).join("")}</div>` : "";
    const items = r.results.length === 0
      ? `<p class="empty">배정된 스케줄이 없습니다.</p>`
      : r.results.slice().sort((a, b) => slotIndex(a.slot) - slotIndex(b.slot)).map(s => `
        <div class="result-item ${roomClass(s.room)}">
          <div class="left">
            <span class="time">${s.slot}~${slotEndTime(s.slot)}</span>
            <span class="code">${s.code}${s.overlayCode ? "+" + s.overlayCode : ""}</span>
            <span>${esc(s.name)}${s.overlayName ? " + " + esc(s.overlayName) : ""}</span>
            <span class="label">${esc(s.label)}</span>
          </div>
          <span class="tag">${esc(s.room)} · ${esc(s.station)}</span>
        </div>`).join("");
    resultHtml = `
      <div class="card">
        <h3>배정 결과 — ${esc(r.patientName)} <span class="pill">(${r.date})</span></h3>
        ${warns}${items}
      </div>`;
  }

  return `
    <h2>환자 등록 및 자동 배정</h2>
    <div class="banner">💡 입력한 환자/스케줄은 <b>이 브라우저</b>에만 저장됩니다. 다른 PC와는 공유되지 않습니다(시험용).</div>
    <div class="card" style="max-width:640px">
      <div class="row">
        <label>환자명</label>
        <input value="${esc(f.name)}" placeholder="홍길동" oninput="rf('name', this.value)" />
      </div>
      <div class="row">
        <label>배정 날짜</label>
        <input type="date" value="${f.date}" oninput="rf('date', this.value)" style="width:auto" />
      </div>
      <div class="row">
        <label>가능 시간</label>
        <div class="inline">
          <select style="width:auto" onchange="rf('start', this.value)">
            ${TIME_SLOTS.map(t => `<option ${t === f.start ? "selected" : ""}>${t}</option>`).join("")}
          </select>
          <span class="muted">~</span>
          <select style="width:auto" onchange="rf('end', this.value)">
            ${TIME_SLOTS.map(t => slotEndTime(t)).map(t => `<option ${t === f.end ? "selected" : ""}>${t}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="row">
        <label>처방코드</label>
        ${codeRows}
        <button class="linkbtn" onclick="addCode()">+ 처방코드 추가</button>
      </div>
      <div id="regErr"></div>
      <div class="actions">
        <button class="primary" onclick="doAssign()">자동 배정</button>
        <button class="ghost" onclick="resetForm()">초기화</button>
      </div>
    </div>
    ${resultHtml}`;
}

window.rf = function (k, v) { registerForm[k] = v; };
window.onCodeRoom = function (i, v) { registerForm.codes[i] = { room: v, code: "" }; render(); };
window.onCodeCode = function (i, v) { registerForm.codes[i].code = v; render(); };
window.addCode = function () { registerForm.codes.push({ room: "", code: "" }); render(); };
window.rmCode = function (i) { registerForm.codes.splice(i, 1); render(); };
window.resetForm = function () { registerForm = { name: "", date: today(), start: "08:00", end: "17:00", codes: [{ room: "", code: "" }] }; lastResult = null; render(); };

window.doAssign = function () {
  const f = registerForm;
  const errBox = document.getElementById("regErr");
  if (!f.name.trim()) { errBox.innerHTML = `<div class="err">환자명을 입력해주세요.</div>`; return; }
  const codes = f.codes.map(c => c.code).filter(Boolean);
  if (codes.length === 0) { errBox.innerHTML = `<div class="err">처방코드를 1개 이상 입력해주세요.</div>`; return; }

  const existing = state.schedules.filter(s => s.date === f.date);
  const { results, warnings } = schedulePatient(
    f.name.trim(), f.start, f.end, codes, state.prescriptions, existing, f.date
  );

  const pid = nextId();
  state.patients.push({ id: pid, name: f.name.trim() });
  for (const r of results) {
    state.schedules.push({
      id: nextId(), patientId: pid, patientName: f.name.trim(),
      code: r.code, name: r.name, overlayCode: r.overlayCode, overlayName: r.overlayName,
      room: r.room, slot: r.slot, station: r.station, label: r.label, date: f.date,
    });
  }
  save();
  lastResult = { patientName: f.name.trim(), date: f.date, results, warnings };
  render();
};

//------------------------------------------------ 환자별 시간표
function viewPatient() {
  if (state.patients.length === 0)
    return `<h2>환자별 시간표</h2><div class="card"><p class="empty">등록된 환자가 없습니다. '환자 등록'에서 먼저 배정해주세요.</p></div>`;

  if (!patientView.patientId) patientView.patientId = String(state.patients[state.patients.length - 1].id);
  const pid = Number(patientView.patientId);
  const patient = state.patients.find(p => p.id === pid);
  const rows = state.schedules
    .filter(s => s.patientId === pid && s.date === patientView.date)
    .sort((a, b) => slotIndex(a.slot) - slotIndex(b.slot));

  const body = rows.length === 0
    ? `<p class="empty">해당 날짜에 배정된 스케줄이 없습니다.</p>`
    : `<table><thead><tr><th>시간</th><th>처방코드</th><th>치료명</th><th>치료실</th><th>스테이션</th><th>표시</th><th></th></tr></thead>
       <tbody>${rows.map(s => `
        <tr>
          <td class="mono">${s.slot}~${slotEndTime(s.slot)}</td>
          <td class="mono" style="color:#1d4ed8">${s.code}${s.overlayCode ? "+" + s.overlayCode : ""}</td>
          <td>${esc(s.name)}${s.overlayName ? " + " + esc(s.overlayName) : ""}</td>
          <td>${esc(s.room)}</td>
          <td>${esc(s.station)}</td>
          <td class="mono" style="color:#4338ca">${esc(s.label)}</td>
          <td><button class="del" onclick="delSchedule(${s.id})">삭제</button></td>
        </tr>`).join("")}</tbody></table>`;

  return `
    <h2>환자별 시간표</h2>
    <div class="card">
      <div class="topbar">
        <div>
          <div class="hint">환자 선택</div>
          <select onchange="pv('patientId', this.value)">
            ${state.patients.map(p => `<option value="${p.id}" ${p.id === pid ? "selected" : ""}>${esc(p.name)} (#${p.id})</option>`).join("")}
          </select>
        </div>
        <div>
          <div class="hint">날짜</div>
          <input type="date" value="${patientView.date}" onchange="pv('date', this.value)" />
        </div>
        <div class="right">
          <button class="danger" onclick="delPatient(${pid})">환자 삭제(퇴원)</button>
        </div>
      </div>
      <h3>${esc(patient?.name || "")}님의 시간표</h3>
      ${body}
    </div>`;
}
window.pv = function (k, v) { patientView[k] = v; render(); };

//------------------------------------------------ 치료실별 시간표
function viewRoom() {
  const room = roomView.room;
  const date = roomView.date;
  const stations = roomStationList(room);
  const here = state.schedules.filter(s => s.room === room && s.date === date);
  const at = (slot, stName) => here.find(s => s.slot === slot && s.station === stName);

  const rooms = Object.keys(state.rooms);
  const grid = `
    <div class="scrollx">
    <table>
      <thead><tr><th>시간</th>${stations.map(st => `<th>${esc(st.name)}</th>`).join("")}</tr></thead>
      <tbody>
        ${TIME_SLOTS.map(slot => `
          <tr>
            <td class="mono muted">${slot}</td>
            ${stations.map(st => {
              const s = at(slot, st.name);
              return `<td>${ s
                ? `<div class="cell-name">${esc(s.label)}</div><div class="cell-code">${s.code}${s.overlayCode ? "+" + s.overlayCode : ""}</div>`
                : `<span class="muted">-</span>` }</td>`;
            }).join("")}
          </tr>`).join("")}
      </tbody>
    </table>
    </div>`;

  return `
    <h2>치료실별 시간표</h2>
    <div class="card">
      <div class="topbar">
        ${rooms.map(r => `<button class="tab ${r === room ? "on" : ""}" onclick="rv('room', '${r}')">${esc(r)}</button>`).join("")}
        <div class="right"><input type="date" value="${date}" onchange="rv('date', this.value)" /></div>
      </div>
      ${stations.length > 0 ? grid : `<p class="empty">치료실 정보가 없습니다.</p>`}
    </div>`;
}
window.rv = function (k, v) { roomView[k] = v; render(); };

//------------------------------------------------ 처방코드 관리
function viewRx() {
  const list = Object.entries(state.prescriptions);
  const rooms = Object.keys(state.rooms);
  return `
    <h2>처방코드 관리</h2>
    <div class="card" style="max-width:720px">
      <h3>새 처방코드 추가</h3>
      <div class="inline" style="gap:12px; align-items:flex-end">
        <div style="flex:1"><div class="hint">코드</div><input id="nrxCode" class="mono" placeholder="MM105AM" /></div>
        <div style="flex:1"><div class="hint">치료명</div><input id="nrxName" placeholder="중추신경계치료(오전)" /></div>
        <div><div class="hint">시간(분)</div><input id="nrxDur" type="number" value="30" min="5" step="5" style="width:90px" /></div>
        <div><div class="hint">치료실</div>
          <select id="nrxRoom">${rooms.map(r => `<option>${esc(r)}</option>`).join("")}</select></div>
        <button class="primary" onclick="addRx()">추가</button>
      </div>
      <div id="rxErr"></div>
    </div>
    <div class="card" style="padding:0; overflow:hidden">
      <table>
        <thead><tr><th>코드</th><th>치료명</th><th>시간</th><th>치료실</th><th>구역</th><th>중첩대상</th><th></th></tr></thead>
        <tbody>${list.map(([code, r]) => `
          <tr>
            <td class="mono" style="color:#1d4ed8">${code}</td>
            <td>${esc(r.name)}</td>
            <td>${r.duration}분</td>
            <td>${esc(r.room)}</td>
            <td class="mono muted">${r.zones ? esc(r.zones.join(",")) : "-"}</td>
            <td class="mono muted">${r.overlayTargets ? esc(r.overlayTargets.join(",")) : "-"}</td>
            <td><button class="del" onclick="delRx('${code}')">삭제</button></td>
          </tr>`).join("")}</tbody>
      </table>
    </div>`;
}
window.addRx = function () {
  const code = document.getElementById("nrxCode").value.toUpperCase().trim();
  const name = document.getElementById("nrxName").value.trim();
  const duration = Number(document.getElementById("nrxDur").value);
  const room = document.getElementById("nrxRoom").value;
  const err = document.getElementById("rxErr");
  if (!code || !name) { err.innerHTML = `<div class="err">코드와 치료명을 입력해주세요.</div>`; return; }
  if (state.prescriptions[code]) { err.innerHTML = `<div class="err">이미 존재하는 처방코드입니다.</div>`; return; }
  state.prescriptions[code] = { name, duration, room };
  save(); render();
};
window.delRx = function (code) { delete state.prescriptions[code]; save(); render(); };
window.delSchedule = function (id) { state.schedules = state.schedules.filter(s => s.id !== id); save(); render(); };
// 환자 삭제(퇴원 처리). 해당 환자의 모든 스케줄도 함께 제거한다.
window.delPatient = function (id) {
  const patient = state.patients.find(p => p.id === id);
  if (!confirm(`${patient ? patient.name : "이 환자"}를 삭제하시겠습니까?\n모든 스케줄에서 함께 삭제되며 되돌릴 수 없습니다.`)) return;
  state.patients = state.patients.filter(p => p.id !== id);
  state.schedules = state.schedules.filter(s => s.patientId !== id);
  if (Number(patientView.patientId) === id) patientView.patientId = "";
  save(); render();
};

//==================================================================
render();
</script>
